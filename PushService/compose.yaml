services:
  pushservice.api:
    image: pushservice.api
    container_name: push-service-api
    build:
      context: ..
      dockerfile: PushService/PushService.API/Dockerfile
    environment:
      - Kafka__SendPushEvent__BootstrapServers=kafka-notification:9092
      - Kafka__ErrorPushEvent__BootstrapServers=kafka-notification:9092
      - Kafka__ApprovePushEvent__BootstrapServers=kafka-notification:9092

      - OneSignal__Url=http://mock-notification-service:8080/notifications/push
      - OneSignal__ApiId=mock-app-id
      - OneSignal__ApiKey=mock-api-key

      - Rabbit__RetrySendEvent__HostName=rabbitmq-notification
      - Rabbit__RetrySendEvent__UserName=guest
      - Rabbit__RetrySendEvent__Password=guest
    networks:
      - notification-network
    
networks:
  notification-network:
    external: true